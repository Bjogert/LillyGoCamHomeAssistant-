; Select an example
[platformio]
src_dir = examples/AllFunction
data_dir = data
; Use our clean ESP32-S3 CAM implementation
; src_dir = examples/CustomOLEDText
; src_dir = examples/MinimalCameraStationExample
; src_dir = examples/MinimalPowersExample
; src_dir = examples/MinimalScreenExample
; src_dir = examples/MinimalSoundDetectionExample
; src_dir = examples/MinimalVoiceWakeupExample
; src_dir = examples/MinimalSpeechRecognitionExample

[env:esp32s3cam]
platform = espressif32@6.4.0
framework = arduino
board = esp32-s3-devkitc-1
upload_speed = 921600
upload_port = COM12
monitor_speed = 115200
monitor_port = COM12
upload_protocol = esptool

board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCAMERA_MODEL_ESP32S3_CAM
    
    ; Pin definitions for ESP32-S3 CAM
    -DY2_GPIO_NUM=15
    -DY3_GPIO_NUM=17
    -DY4_GPIO_NUM=18
    -DY5_GPIO_NUM=16
    -DY6_GPIO_NUM=14
    -DY7_GPIO_NUM=12
    -DY8_GPIO_NUM=11
    -DY9_GPIO_NUM=48
    -DXCLK_GPIO_NUM=10
    -DPCLK_GPIO_NUM=21
    -DVSYNC_GPIO_NUM=13
    -DHREF_GPIO_NUM=47
    -DSIOD_GPIO_NUM=40
    -DSIOC_GPIO_NUM=39
    -DPWDN_GPIO_NUM=-1
    -DRESET_GPIO_NUM=-1

lib_deps =
    knolleary/PubSubClient @ ^2.8